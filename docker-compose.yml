version: '3.8'

services:

  # ─── Banco de dados ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    environment:
      POSTGRES_DB: pos_transactions
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_transactions"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Microserviço mock da API externa de pagamentos ─────────────────────
  external-payment-mock:
    build:
      context: ./external-payment-mock
      dockerfile: Dockerfile
    container_name: external-payment-mock
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── API principal de transações POS ─────────────────────────────────────
  pos-transactions:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-transactions-api
    depends_on:
      postgres:
        condition: service_healthy
      external-payment-mock:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pos_transactions
      DATABASE_USERNAME: pos_user
      DATABASE_PASSWORD: pos_password
      HMAC_SECRET: my-super-secret-key-change-in-production
      HMAC_ENABLED: "true"
      EXTERNAL_PAYMENT_URL: http://external-payment-mock:8081
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
