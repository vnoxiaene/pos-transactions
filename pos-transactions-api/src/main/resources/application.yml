spring:
  application:
    name: pos-transactions
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pos_transactions}
    username: ${DATABASE_USERNAME:pos_user}
    password: ${DATABASE_PASSWORD:pos_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [correlationId=%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.pos.transactions: DEBUG
    io.github.resilience4j: INFO

security:
  hmac:
    secret: ${HMAC_SECRET:my-super-secret-key-change-in-production}
    enabled: ${HMAC_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      externalPaymentApi:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      externalPaymentApi:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.pos.transactions.exception.CircuitBreakerOpenException
          - com.pos.transactions.exception.InvalidRequestException
          - com.pos.transactions.exception.InvalidTransactionStateException
          - com.pos.transactions.exception.TransactionNotFoundException
  bulkhead:
    instances:
      externalPaymentApi:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms

external:
  payment:
    base-url: ${EXTERNAL_PAYMENT_URL:http://localhost:8081}
    # Timeout em ms aplicado no HttpClient (connect + read).
    # Substituí @TimeLimiter (requer CompletableFuture) por timeout nativo do HttpClient,
    # mantendo a API síncrona conforme o contrato dos endpoints.
    timeout-ms: ${EXTERNAL_PAYMENT_TIMEOUT_MS:3000}
